name: kspo-local
services:
  nginx:
    image: nginx:alpine
    ports: ["127.0.0.1:3334:80"]
    volumes: ["./docker/nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
    restart: unless-stopped
  web:
    image: kspo-ingest-local-web:dev
    build: {context: ., dockerfile: docker/Dockerfile.web}
    environment: {NODE_ENV: production, TZ: Asia/Seoul}
    restart: unless-stopped
  api:
    image: kspo-ingest-local-api:dev
    build: {context: ., dockerfile: docker/Dockerfile.api}
    env_file: .env
    volumes: ["storage:/data", "./src:/app/src:ro", "./configs:/app/configs:ro"]
    depends_on:
      migrations: {condition: service_completed_successfully}
      qdrant: {condition: service_started}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  worker:
    image: kspo-ingest-local-worker:dev
    build: {context: ., dockerfile: docker/Dockerfile.worker}
    command: [arq, kspo_ingest.local_worker.WorkerSettings]
    env_file: .env
    volumes: ["storage:/data", "./src:/app/src:ro", "./configs:/app/configs:ro"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    shm_size: 1gb
  migrations:
    image: kspo-ingest-local-api:dev
    build: {context: ., dockerfile: docker/Dockerfile.api}
    env_file: .env
    command: [alembic, upgrade, head]
    volumes: ["./migrations:/app/migrations:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["127.0.0.1:6334:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
  qdrantdata:
  storage:
