name: kspo

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "80:80"
      - "3333:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    environment:
      - TZ=Asia/Seoul
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on:
      api:
        condition: service_started
    expose:
      - "3300"
    environment:
      - TZ=Asia/Seoul
      - NODE_ENV=production
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - storage:/data
    environment:
      - TZ=Asia/Seoul
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,postgres,redis,qdrant,host.docker.internal}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage:/data
    environment:
      - TZ=Asia/Seoul
      - WORKER_QUEUES=default,attach,bg
      - WORKER_CONCURRENCY=4
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,postgres,redis,qdrant,host.docker.internal}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kspo_ingest}
      POSTGRES_USER: ${POSTGRES_USER:-kspo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kspo}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "''", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - TZ=Asia/Seoul
    restart: unless-stopped

  migrations:
    build:
      context: ..
      dockerfile: docker/Dockerfile.migrations
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrations
    command: ["alembic", "upgrade", "head"]

volumes:
  pgdata: {}
  redisdata: {}
  storage: {}

networks:
  default:
    name: kspo-ingest-net
