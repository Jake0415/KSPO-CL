worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 110M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80 default_server;
        server_name _;

        # Docker 임베디드 DNS로 런타임마다 upstream 재-resolve.
        # static upstream{}은 시작 시점 IP를 영구 캐시 → api/web 재시작 시
        # 옛 IP를 물고 502(connect refused). resolver + 변수 proxy_pass로
        # 컨테이너 IP가 바뀌어도 valid TTL 내 자동 반영(nginx 재시작 불필요).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8080;
        set $web_upstream web:3300;

        location /api/ {
            # JSON API uses the form login page; retain HTTP 401 without a browser Basic dialog.
            proxy_hide_header WWW-Authenticate;
            proxy_pass http://$api_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $http_x_request_id;
            proxy_read_timeout 120s;
        }

        location /files/ {
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }

        location = /healthz { proxy_pass http://$api_upstream; }
        location = /readyz  { proxy_pass http://$api_upstream; }
        location /docs      { proxy_pass http://$api_upstream; }
        location /openapi.json { proxy_pass http://$api_upstream; }

        # Next.js standalone Node 서버 (web 컨테이너 :3300). HMR/RSC stream 대비 keepalive + upgrade.
        location / {
            proxy_pass http://$web_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout 120s;
        }
    }
}
