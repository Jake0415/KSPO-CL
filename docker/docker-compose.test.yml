# 테스트 격리 stack — local/CI에서 fast restart, tmpfs로 메모리 디스크 사용.
# 운영 docker-compose.yml과 분리: 호스트 포트 5xxxx 대역 + name=kspo-ingest-test로 충돌 방지.
#
# 사용법:
#   docker compose -f docker/docker-compose.test.yml up -d --wait
#   pytest -m e2e tests/e2e/
#   docker compose -f docker/docker-compose.test.yml down -v
name: kspo-ingest-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kspo_ingest_test
      POSTGRES_USER: kspo
      POSTGRES_PASSWORD: kspo
      TZ: Asia/Seoul
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kspo -d kspo_ingest_test"]
      interval: 3s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "''", "--appendonly", "no"]
    ports:
      - "56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "56333:6333"
    tmpfs:
      - /qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/ || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 15

networks:
  default:
    name: kspo-ingest-test-net
