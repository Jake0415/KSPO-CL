name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kspo_ingest_test
          POSTGRES_USER: kspo
          POSTGRES_PASSWORD: kspo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U kspo -d kspo_ingest_test"
          --health-interval 10s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: pip install -e .[test,dev]
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Pytest
        run: pytest -q
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: kspo
          POSTGRES_PASSWORD: kspo
          POSTGRES_DB: kspo_ingest_test
          REDIS_URL: redis://localhost:6379/0
          ADMIN_PASSWORD_BCRYPT: $2b$12$CIplaceholderxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          SESSION_SECRET: ci_dummy_session_secret_at_least_32_bytes_long
          OPENAI_API_KEY: sk-ci-dummy
          OPENAI_MONTHLY_BUDGET_KRW: "150000"
          QDRANT_URL: http://localhost:6333

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci || npm install
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build
