# Global selector blacklist (`docs/design/02_pipeline.md` §2.10 미러).
# 도메인별 추가는 domains.selector_blacklist 컬럼으로 누적.
#
# 2026-07-05 데이터 신뢰성 테스트 결과 반영:
# - 퀵메뉴/패밀리사이트/팝업/배너 잔여 해소
# - spoinfo 푸터(저작권/개인정보/찾아오시는길) 제거 강화
# - kspo/ksponco/parktel 퀵메뉴 제거

# --- 구조 태그 ---
- header
- nav
- footer
- aside
- .skip

# --- 네비게이션 ---
- .gnb
- .lnb
- .snb
- .breadcrumb
- .location
- .topMenu
- .top-menu
- .sub-menu
- .subMenu
